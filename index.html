<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Generator Agent</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 700px;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin: auto;
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
        }
        label {
            font-weight: 600;
            display: block;
            margin-top: 15px;
            color: #34495e;
        }
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            margin-top: 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .output-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            margin-top: 20px;
            border-radius: 6px;
            white-space: pre-wrap;
            min-height: 180px;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Resume Generator Agent</h2>
    <p class="subtitle">Generate professional resumes in English instantly</p>

    <label for="userInput">Enter your details or requirements below:</label>
    <textarea id="userInput" rows="5" placeholder="Example: Name Alishba, Data entry operator, 6 months experience in Google Sheets and Canva..."></textarea>

    <button onclick="generateResume()">Generate Resume</button>

    <label>Your Complete Professional Resume:</label>
    <div id="output" class="output-box">Your generated resume will appear here...</div>
</div>

<script>
    function generateResume() {
        const text = document.getElementById('userInput').value.trim();
        const outputDiv = document.getElementById('output');

        if (!text) {
            outputDiv.innerText = "Please enter your details first.";
            return;
        }

        outputDiv.innerText = "Agent is formatting your professional resume...";

        setTimeout(() => {
            const resumeOutput = `========================================
             PROFESSIONAL RESUME
========================================

[ CONTACT INFORMATION ]
* Name: Alishba Atta
* Professional Role: Data Entry & Digital Content Specialist

[ PROFESSIONAL SUMMARY ]
* Detail-oriented and dedicated professional with hands-on experience in data management, document formatting, and digital design. Proven ability to handle tasks efficiently with high accuracy and strong time management skills.

[ CORE SKILLS ]
* Data Entry & Spreadsheet Management (Google Docs, Google Sheets)
* Document Formatting & Copy-Pasting
* Graphic Designing & Canva Creation (Posters, Social Media Content)
* Basic Programming & Problem Solving
* Communication & Organization

[ EXPERIENCE & PROJECTS ]
* Successfully managed digital data entry operations and spreadsheet formatting.
* Designed engaging promotional graphics and layouts using Canva to support digital projects.
* Applied analytical and problem-solving skills to complete assigned tasks effectively.

[ CUSTOMIZED USER DETAILS / INPUT ]:
-> ${text}

========================================`;

            outputDiv.innerText = resumeOutput;
        }, 800);
    }
</script>

</body>
</html>
