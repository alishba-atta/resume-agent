<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Generator Agent</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 700px;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin: auto;
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
        }
        label {
            font-weight: 600;
            display: block;
            margin-top: 15px;
            color: #34495e;
        }
        textarea, select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            margin-top: 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .output-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            margin-top: 20px;
            border-radius: 6px;
            white-space: pre-wrap;
            min-height: 180px;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Resume Generator Agent</h2>
    <p class="subtitle">Aapka data, aapki pasandeeda language mein resume</p>

    <label for="langSelect">Jawab ki Language Select Karein:</label>
    <select id="langSelect">
        <option value="roman">Roman Urdu</option>
        <option value="english">English</option>
        <option value="urdu">Urdu ( اردو )</option>
    </select>

    <label for="userInput">Apni details ya requirements yahan likhein (Kisi bhi language mein):</label>
    <textarea id="userInput" rows="5" placeholder="Misal: Name Alishba, Data entry operator, 6 months experience in Google sheets..."></textarea>

    <button onclick="generateResume()">Resume Banayein</button>

    <label>Aapka Mukammal Resume:</label>
    <div id="output" class="output-box">Yahan aapka professional resume show hoga...</div>
</div>

<script>
    function generateResume() {
        const text = document.getElementById('userInput').value.trim();
        const selectedLang = document.getElementById('langSelect').value;
        const outputDiv = document.getElementById('output');

        if (!text) {
            outputDiv.innerText = "Barah-e-karam pehle apni kuch details enter karein.";
            return;
        }

        outputDiv.innerText = "Agent resume format tayar kar raha hai...";

        setTimeout(() => {
            let resumeOutput = "";

            if (selectedLang === "roman") {
                resumeOutput = `========================================
             PROFESSIONAL RESUME
========================================

[ RABTA / CONTACT INFORMATION ]
* Naam: Alishba Atta
* Field: Data Entry & Digital Services

[ PROFESSIONAL SUMMARY ]
* Ek mehnati aur professional profile jo diye gaye tajurbay aur skills ke mutabiq tayar ki gayi hai.

[ BUNYADI SKILLS (CORE SKILLS) ]
* Data Entry & Spreadsheet Management (Google Docs / Sheets)
* Document Formatting & Copy-Pasting
* Graphic Designing & Canva Post Creation
* Time Management & Problem Solving

[ TAJURBA / EXPERIENCE & PROJECTS ]
* Diye gaye data ke mutabiq tamam tasks ko behtareen aur error-free tareeqay se anjam diya gaya hai.

[ USER DATA DETAILS ]:
-> ${text}
========================================`;
            } else if (selectedLang === "urdu") {
                resumeOutput = `========================================
             پروفیشنل ریزوم
========================================

[ رابطہ کی معلومات ]
* نام: علیشہ عطا
* شعبہ: ڈیٹا انٹری اور ڈیجیٹل سروسز

[ پروفیشنل سمری ]
* دی گئی تفصیلات اور تجربے کے مطابق تیار کردہ پیشہ ورانہ پروفائل۔

[ بنیادی مہارتیں (CORE SKILLS) ]
* ڈیٹا انٹری اور اسریڈشیٹ مینجمنٹ (گوگل ڈاکس / شیٹس)
* دستاویز کی فارمیٹنگ اور کاپی پیسٹنگ
* گرافک ڈیزائننگ اور کینوا پوسٹ کی تخلیق

[ تجربہ اور پروجیکٹس ]
* تمام ڈیجیٹل ٹاسکس کو درستگی کے ساتھ مکمل کرنے کا تجربہ۔

[ صارف کی فراہم کردہ تفصیلات ]:
-> ${text}
========================================`;
            } else {
                resumeOutput = `========================================
             PROFESSIONAL RESUME
========================================

[ CONTACT INFORMATION ]
* Name: Alishba Atta
* Field: Data Entry & Digital Services

[ PROFESSIONAL SUMMARY ]
* Detail-oriented and results-driven professional profile built according to the provided details and experience.

[ CORE SKILLS ]
* Data Entry & Spreadsheet Management (Google Docs / Sheets)
* Document Formatting & Copy-Pasting
* Graphic Designing & Canva Creation
* Time Management & Problem Solving

[ EXPERIENCE & PROJECTS ]
* Successfully managed and executed digital tasks and project formatting with high precision.

[ PROVIDED USER DETAILS ]:
-> ${text}
========================================`;
            }

            outputDiv.innerText = resumeOutput;
        }, 800);
    }
</script>

</body>
</html>
